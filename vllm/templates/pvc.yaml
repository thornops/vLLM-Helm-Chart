apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-model-pvc
  labels:
    {{- include "vllm.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi # Adjust based on the size of the models you plan to host
  # storageClassName: "your-fast-nvme-storage-class" # Highly recommended for fast loading